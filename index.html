<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Duel Disk</title>
<link rel="stylesheet" href="css/estilo.css">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#06102f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body data-t="duelo">
<div id="bgart"><div class="gr"></div></div>
<h1>⚡ DUEL DISK ⚡</h1>
<main>
<section id="decks"><button class="btn" style="margin-bottom:10px;padding:12px;font-size:.85rem" onclick="deckForm(-1)">➕ Novo deck</button><div class="chips" id="filtro"></div><div id="lista"></div></section>
<section id="sorteio">
  <div class="mode"><button id="m_justo" onclick="setMode('justo')">⚖️ Justo<small>tiers parecidos</small></button><button id="m_total" onclick="setMode('total')">🎲 Total<small>qualquer deck</small></button><button id="m_draft" onclick="setMode('draft')">🃏 Draft<small>escolha entre 3</small></button></div>
  <div class="opts"><label class="tg"><input type="checkbox" id="oRep" onchange="SRT.rep=this.checked;saveSort();rSort()"><span>🔁 Não repetir decks<small>só repete depois de usar todos</small></span></label><label class="tg"><input type="checkbox" id="oMd3" onchange="SRT.md3=this.checked;saveSort();rSort()"><span>🎯 Melhor de 3<small>vence quem ganhar 2 duelos com os mesmos decks</small></span></label></div>
  <div id="pool" class="cnote" style="text-align:center;margin:-2px 0 10px"></div>
  <button class="btn" id="bSort" onclick="sortear()">Sortear decks</button><div id="resultado" style="margin-top:12px"></div>
</section>
<section id="torneio"><div id="tour"></div></section>
<section id="duelo" class="on">
  <div id="tmb"></div>
  <div class="tb"><button class="ib" onclick="menu()">☰</button><button class="ib" onclick="escolher()" aria-label="Escolher decks">📚</button><button class="ib" onclick="dado()">🎲</button><button class="ib" onclick="moeda()"><span class="coin-ic"></span></button><button class="ib" id="bMic" onclick="vOuvir()" aria-label="Falar jogada">🎙️</button><button class="ib" id="bMute">🔊</button></div><div id="vzb" role="status"></div>
  <div id="players"></div>
  <div class="calc"><div class="trw"><button class="trb0" onclick="turn(-1)" aria-label="Voltar um turno">‹</button><button class="trb" id="trb" onclick="turn(1)" aria-label="Passar o turno"></button></div><span id="amt" aria-label="Valor">0</span></div>
  <div class="lab"><span style="color:var(--g)">DOUGLAS</span><span style="color:var(--b)">JOÃO</span></div>
  <div class="pad" id="pad"></div>
</section>
<section id="stats"><div id="stx"></div></section>
<section id="hist"><div id="score"></div><div id="hseg"></div><div id="hl"></div><div class="row hbar" style="margin:10px 0"><button class="btn" id="bTxt">📄 TXT</button><button class="btn" id="bExp">💾 Backup</button><label class="btn" style="text-align:center;cursor:pointer">⬇ Importar<input type="file" id="fImp" accept=".json,application/json" hidden></label></div><details class="hlp"><summary>O que é cada botão?</summary><p><b>TXT</b>: para ler em qualquer aparelho. <b>Backup</b> (.json): para restaurar ou juntar com outro celular; leva duelos, torneio, campeões, áudios próprios, tiers e configurações. <b>Importar</b>: carrega um backup.</p></details><div id="bkban"></div><details class="hlp" id="bkd"><summary>🛡️ Cópias automáticas</summary><div id="bkl"></div></details><button class="lnk" id="bClear">Limpar histórico</button></section>
</main>
<nav><button data-t="decks">📚<br>Decks</button><button data-t="sorteio">🎴<br>Sorteio</button><button data-t="torneio">🏟️<br>Torneio</button><button data-t="duelo" class="on">⚔️<br>Duelo</button><button data-t="stats">📊<br>Stats</button><button data-t="hist">🏆<br>Histórico</button></nav>
<div id="tfr"></div><div id="tnp"></div><div id="tbn"></div><div id="modal"><div class="box" id="box"></div></div>
<div id="fx"></div>
<div id="sbar"><button class="sb1" onclick="sortear()">🔄 Sortear de novo</button><button class="sb2" onclick="goTab('duelo')">⚔️ Ir para o duelo</button></div>
<div id="toast" role="status"></div>

<script src="js/dados/decks.js"></script>
<script src="js/dados/cartas.js"></script>
<script src="js/base.js"></script>
<script src="js/sons.js"></script>
<script src="js/artes.js"></script>
<script src="js/interface.js"></script>
<script src="js/cadastro-decks.js"></script>
<script src="js/sorteio.js"></script>
<script src="js/duelo.js"></script>
<script src="js/dado-moeda.js"></script>
<script src="js/historico.js"></script>
<script src="js/backup.js"></script>
<script src="js/imagem-resultado.js"></script>
<script src="js/mvp.js"></script>
<script src="js/lista-cartas.js"></script>
<script src="js/fundo-animado.js"></script>
<script src="js/torneio.js"></script>
<script src="js/liga.js"></script>
<script src="js/animacoes.js"></script>
<script src="js/estatisticas.js"></script>
<script src="js/ia/oraculo.js"></script>
<script src="js/ia/voz.js"></script>
<script src="js/chaveamento.js"></script>
<script src="js/ia/oraculo-historico.js"></script>
<script src="js/duelo-salvo.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
