<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Duel Disk</title>
<style>
:root{--cy:#35e0ff;--gd:#f2c14e;--g:#3dff7a;--b:#4aa3ff;--bg:#040b22;--tx:#e6f4ff;--mut:#8fb0d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;color:var(--tx);font-family:system-ui,sans-serif;touch-action:manipulation;background:repeating-linear-gradient(45deg,rgba(242,193,78,.035) 0 2px,transparent 2px 16px),radial-gradient(ellipse at 50% 0,#243d9c,transparent 62%),radial-gradient(ellipse at 100% 100%,#4a1d7a99,transparent 55%),radial-gradient(ellipse at 0 70%,#7a2a2a55,transparent 50%),var(--bg) fixed;padding-bottom:78px}
h1{margin:0;text-align:center;padding:10px;font:900 1.3rem Impact,"Arial Narrow",sans-serif;letter-spacing:4px;color:var(--gd);text-shadow:0 0 10px #f2c14e88}
main{max-width:520px;margin:auto;padding:0 10px}
section{display:none}section.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#050f2e;border-top:2px solid var(--cy);box-shadow:0 -4px 16px #35e0ff33;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;padding:11px 0;background:none;border:0;color:var(--mut);font-weight:800;font-size:.72rem}
nav button.on{color:var(--cy);background:linear-gradient(#0000,#35e0ff22)}
button{font:inherit;cursor:pointer;color:var(--tx)}
.card{background:linear-gradient(#10265f,#0a1740);border:1px solid #2c58b8;border-radius:12px;padding:12px;margin-bottom:12px}
.btn{width:100%;padding:15px;border-radius:10px;border:2px solid var(--gd);background:linear-gradient(#3a3f7a,#14183f);color:var(--gd);font:900 1rem Impact,sans-serif;letter-spacing:2px;text-transform:uppercase}
.btn:active,.k:active,.ib:active{transform:scale(.95);filter:brightness(1.3)}
.row{display:flex;gap:10px}.row>*{flex:1}
.tier{padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:900;color:#111}
.t1{background:#ff5a6e}.t2{background:#ffc83d}.t3{background:#5fd39a}.t4{background:#4fb8ff}.t5{background:#9aa6c4}
.chips{display:flex;gap:8px;margin-bottom:12px}.chips button{flex:1;padding:10px 0;border-radius:99px;border:1px solid #2c58b8;background:#0a1740;font-weight:800;color:var(--mut)}.chips button.on{border-color:var(--gd);color:var(--gd)}
.art{--c:#888;position:relative;display:grid;place-items:center;background:linear-gradient(150deg,var(--c),#050b20 85%) center/cover;border:2px solid var(--gd);border-radius:8px;overflow:hidden}
.art span{font-size:2rem;filter:drop-shadow(0 0 8px #000)}
.art>.atr{position:absolute;top:3px;right:3px;width:clamp(16px,24%,34px);aspect-ratio:1/1;display:block;filter:drop-shadow(0 1px 2px #000)}.atr svg{width:100%;height:100%;display:block}
.dk{display:flex;gap:12px;align-items:center}.dk .art{width:72px;height:72px;flex:none}.dk small{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);margin-top:3px;font-size:.8rem}
.mode{display:flex;gap:8px;margin-bottom:12px}.mode button{flex:1;padding:14px 4px;border-radius:10px;border:1px solid #2c58b8;background:#0a1740;font-weight:900;color:var(--mut)}.mode button.on{border-color:var(--gd);color:var(--gd)}
.rc{text-align:center;border-width:2px}.rc h3{margin:8px 0}
.rc .art,.box .art{width:min(250px,100%);aspect-ratio:1/1;margin:8px auto}
.rc .art span,.box .art span{font-size:4rem}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}.shuf{animation:fl .1s infinite}
@keyframes pop{from{transform:scale(.6) rotateX(60deg);opacity:0}}@keyframes fl{50%{opacity:.6;filter:hue-rotate(60deg)}}
.info{padding:10px 18px;border-radius:10px;border:1px solid var(--gd);background:#0006;font-weight:800;margin:6px 0 2px}
/* ---- Contador estilo Duel Disk ---- */
.tb{display:flex;gap:8px;margin-bottom:10px}
.ib{flex:1;padding:9px 0;font-size:1.4rem;border-radius:10px;border:2px solid var(--cy);background:linear-gradient(#17357f,#0a1a4a);box-shadow:0 0 10px #35e0ff44;display:grid;place-items:center;min-height:50px}
#bgart{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#1b4bff,#0a22b8 45%,#040f55 80%)}
#bgart .gr{position:absolute;left:-60%;right:-60%;top:36%;height:90%;transform:perspective(340px) rotateX(63deg);transform-origin:50% 0;background:repeating-linear-gradient(90deg,rgba(130,190,255,.45) 0 2px,transparent 2px 56px),repeating-linear-gradient(0deg,rgba(130,190,255,.45) 0 2px,transparent 2px 56px);animation:gm 3.5s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
@keyframes gm{to{background-position:0 56px,0 56px}}
#bgart .sq{position:absolute;border:1px solid rgba(150,205,255,.55);background:rgba(120,190,255,.14);animation:pl 5s ease-in-out infinite}
@keyframes pl{50%{opacity:.15}}
#bgart::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(3,10,40,.45),rgba(3,10,40,.1) 40%,rgba(3,10,40,.55))}
.bc{position:absolute;width:var(--w);height:calc(var(--w)*1.46);perspective:600px;opacity:.8;z-index:1;animation:dr var(--d) ease-in-out infinite alternate}
@keyframes dr{from{transform:rotate(var(--r))}to{transform:translate(var(--x),var(--y)) rotate(calc(var(--r) + var(--rr)))}}
.bc .cd{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.4,.1,.2,1)}
.bc.f .cd{transform:rotateY(180deg)}
.bc .fc,.bc .bk2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;box-shadow:0 5px 14px #0009}
.bc .fc{transform:rotateY(180deg);background:#10142f center/100% 100% no-repeat}
.bc .bk2{background:radial-gradient(ellipse 26% 34% at 50% 50%,#000 0 72%,transparent 76%),repeating-conic-gradient(from 15deg at 50% 50%,#3a1a05 0 9deg,#94501a 9deg 18deg,#5e2d09 18deg 27deg);border:3px solid #d9a05a;box-sizing:border-box}
@media(prefers-reduced-motion:reduce){.bc,#bgart .gr,#bgart .sq{animation:none}}
.coin-ic{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff4b8,#e0a81e 55%,#8a5a05);border:2px solid #b27a10;box-shadow:inset 0 0 0 1.5px #ffe9a0,0 0 8px #f2c14e88;display:grid;place-items:center}
.coin-ic::after{content:"";width:68%;height:68%;background:url("data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20fill%3D%22none%22%20stroke%3D%22%235a3d00%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M6%2050Q50%2012%2094%2050Q50%2088%206%2050Z%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2214%22%20fill%3D%22%235a3d00%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%225%22%20fill%3D%22%23ffe9a0%22%20stroke%3D%22none%22%2F%3E%3Cpath%20d%3D%22M20%2030Q50%208%2080%2030%22%2F%3E%3Cpath%20d%3D%22M54%2066Q58%2082%2074%2082Q90%2082%2090%2068%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.pl{display:flex;gap:6px;height:128px;padding:6px;margin-bottom:10px;border-radius:10px;border:2px solid var(--c);background:#07122f;box-shadow:0 0 14px var(--c)}
.pl{transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.3,1)}
#players.lphide .pl{opacity:0;transform:translateX(-46px) scale(.96);pointer-events:none}#players.lphide .pl+.pl{transform:translateX(46px) scale(.96)}
#players.lpin .pl+.pl{transition-delay:.14s}#players.lpin .pl{animation:lpf .8s ease-out}
@keyframes lpf{0%{filter:brightness(2.2) saturate(1.5)}100%{filter:none}}
.pl.hit{animation:sh .4s;box-shadow:0 0 24px #f33}.pl.heal{box-shadow:0 0 24px #3ff}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.g{width:20px;display:flex;flex-direction:column;gap:2px;flex:none}.g i{flex:1;border-radius:2px;transition:opacity .15s}.g i.off{opacity:.12}
.gold{flex:1;min-width:0;display:flex;align-items:center;padding:6px;border-radius:8px;background:linear-gradient(#ffe39a,#d99a1e 45%,#8d5a05);box-shadow:inset 0 0 0 2px #fff3c4aa}
.lcd{width:100%;padding:8px 2px;text-align:center;border-radius:6px;background:linear-gradient(#7a40d8,#3a1a86);border:2px solid #20104f;font:900 clamp(1.6rem,8vw,2.3rem)/1 "Arial Black",Impact,sans-serif;color:#fff;text-shadow:0 0 8px #d5b8ff,0 2px 0 #20104f}
.ptw{height:100%;aspect-ratio:1/1;flex:none}.ptw .art{width:100%;height:100%;border-color:#cfe7ff}
.ptw b{position:absolute;left:0;right:0;bottom:0;padding:8px 2px 2px;text-align:center;font:900 .7rem Impact,sans-serif;letter-spacing:1px;background:linear-gradient(#0000,#000d)}
.ptw b small{display:block;font:600 .55rem system-ui;color:var(--gd);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc{display:flex;align-items:center;gap:10px;padding:8px 14px;margin-bottom:8px;border-radius:10px;border:2px solid var(--cy);background:linear-gradient(#050d2c,#0a1d55);box-shadow:inset 0 0 12px #000}
.calc b{font:800 .7rem system-ui;letter-spacing:2px;color:var(--mut)}.calc span{flex:1;text-align:right;font:900 2rem "Arial Black",Impact,sans-serif;color:#fff;text-shadow:0 0 8px var(--cy)}
.lab{display:grid;grid-template-columns:1fr 1fr;text-align:center;font:900 .8rem Impact,sans-serif;letter-spacing:2px;margin-bottom:4px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{padding:14px 0;font:900 1.5rem "Arial Black",Impact,sans-serif;border-radius:10px;border:2px solid #4aa9ff;background:linear-gradient(#244b9c,#0a1d52);color:#dff3ff;text-shadow:0 0 8px var(--cy);box-shadow:inset 0 0 8px #35e0ff55}
.k.sm{font-size:1.1rem;padding:11px 0;border-color:var(--gd);color:var(--gd)}
.k.g1{border-color:#9dffb4;background:linear-gradient(#27c455,#0b6a2b);color:#fff}
.k.b1{border-color:#a9d0ff;background:linear-gradient(#3a7cff,#143c9c);color:#fff}
/* ---- Dado e moeda ---- */
.st{height:160px;display:grid;place-items:center;perspective:700px}.res{min-height:2.4rem;font:900 1.8rem Impact,sans-serif;color:var(--gd);margin:6px 0}
.toss{animation:toss 1.4s}@keyframes toss{0%{transform:translateY(0)}35%{transform:translateY(-50px) scale(1.25)}60%{transform:translateY(0) scale(1)}72%{transform:translateY(-14px)}85%,100%{transform:translateY(0)}}
.cube{width:92px;height:92px;position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.15,.7,.25,1)}
.f{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;background:linear-gradient(135deg,#fff,#d6d0bd);border-radius:16px;border:1px solid #b9b19a}
.f u{place-self:center;width:17px;height:17px;border-radius:50%;text-decoration:none}.f u.p{background:radial-gradient(circle at 35% 30%,#555,#000)}
.f1 u.p{width:24px;height:24px;background:radial-gradient(circle at 35% 30%,#ff8a8a,#b00)}
.f1{transform:translateZ(46px)}.f6{transform:rotateY(180deg) translateZ(46px)}.f2{transform:rotateY(90deg) translateZ(46px)}.f5{transform:rotateY(-90deg) translateZ(46px)}.f3{transform:rotateX(90deg) translateZ(46px)}.f4{transform:rotateX(-90deg) translateZ(46px)}
.coin{width:96px;height:96px;position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.2,.7,.3,1)}
.coin div{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#fff4b8,#e0a81e 55%,#8a5a05);border:4px solid #b27a10;box-shadow:inset 0 0 0 3px #ffe9a0,inset 0 0 0 6px #c58f16,inset 0 0 14px #5a3d0088,0 2px 8px #000a}.coin div svg{width:62%;height:62%;filter:drop-shadow(0 1px 0 #fff3b0)}.coin .bk{transform:rotateY(180deg)}
/* ---- Histórico ---- */
#score{text-align:center;font:900 1.8rem Impact,sans-serif;margin:6px 0 12px}
.hh{display:flex;justify-content:space-between;align-items:center}.hh small{color:var(--mut)}.hd{margin:6px 0;font-weight:700}.hd em{color:var(--gd);font-style:normal;font-size:.8rem}
.hs{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}
details{margin-top:8px}summary{color:var(--cy);font-weight:800;padding:6px 0}.lg{font-size:.8rem;padding:2px 0}
#modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:16px;z-index:9}#modal.on{display:grid}
.box{background:linear-gradient(#10265f,#0a1740);border:2px solid var(--gd);border-radius:16px;padding:18px;max-width:400px;width:100%;text-align:center;max-height:94vh;overflow:auto}
.box h2{margin:0 0 8px;color:var(--gd);font-family:Impact,sans-serif;letter-spacing:2px}.box .btn{margin-top:8px}
.clh{margin:14px 0 6px;color:var(--gd);font:900 .95rem Impact,sans-serif;letter-spacing:2px;text-align:left}
.cg{margin:10px 0 4px;color:var(--cy);font-weight:800;font-size:.78rem;letter-spacing:1px;text-align:left}
.cr{display:flex;gap:10px;align-items:center;padding:6px;border-radius:8px;border:1px solid #2c58b8;background:#0b1a47;margin-bottom:5px;text-align:left;cursor:pointer}
.cr:active{background:#14306f}
.cr .ph{position:relative;width:38px;height:55px;border-radius:3px;flex:none;background:#10142f center/cover no-repeat}.qt{position:absolute;top:-5px;right:-6px;background:var(--gd);color:#111;font:900 .72rem Impact,sans-serif;letter-spacing:.5px;padding:1px 6px;border-radius:99px;border:1.5px solid #fff;box-shadow:0 1px 4px #000a;z-index:1}.cdv .bigw{position:relative;width:42%;flex:none}.cdv .bigw .big{width:100%}.cdv .bigw .qt{font-size:.95rem;top:-7px;right:-7px;padding:2px 9px}
.cr b{font-size:.84rem;display:block;line-height:1.2}.cr small{color:var(--mut);font-size:.72rem}.cr em{color:#ffb36b;font-style:normal;font-size:.7rem}
.cdv{display:flex;gap:10px;align-items:flex-start;text-align:left}.cdv .big{width:42%;aspect-ratio:421/614;border-radius:4px;flex:none;background:#10142f center/cover no-repeat;box-shadow:0 3px 10px #000a}
.ctb{width:100%;border-collapse:collapse;font-size:.8rem}.ctb td{border:1px solid #2c58b8;padding:5px 6px;vertical-align:middle}.ctb td.ck{background:#10265f;color:var(--mut);width:36%}
.ctb .atr{position:static;display:inline-block;width:18px;height:18px;vertical-align:middle;margin-right:4px}
.ctx{margin-top:10px;border:1px solid #2c58b8;border-radius:8px;padding:10px;text-align:left;font-size:.85rem;line-height:1.45;background:#0b1a47}
.ctx h4{margin:0 0 6px;color:var(--gd);font-size:.85rem}.cnote{color:var(--mut);font-size:.72rem;margin-top:6px}
.inf{text-align:left;font-size:.88rem;line-height:1.45}.inf p{margin:8px 0}
/* ---- Torneio ---- */
.tstp{display:flex;gap:5px;margin-bottom:12px}
.tstp button{flex:1;min-width:0;padding:8px 2px;border-radius:10px;border:1px solid #2c58b8;background:#0a1740;color:var(--mut);font-weight:800;font-size:.7rem;line-height:1.25}
.tstp button small{display:block;font-size:.62rem;opacity:.85;font-weight:700}
.tstp button.ok{border-color:#3dff7a88;color:#9dffb4}
.tstp button.on{border-color:var(--gd);color:var(--gd);background:linear-gradient(#3a3f7a,#14183f)}
.thd{text-align:center}.thd .tsc{font:900 1.5rem Impact,sans-serif}.thd small{color:var(--mut);font-size:.75rem}
.tbar{height:8px;border-radius:99px;background:#0007;overflow:hidden;margin:8px 0 4px}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gd));transition:width .4s}
.thd .btn{margin-top:10px;font-size:.9rem;padding:13px}
.tm{padding:10px}.tm.ready{border-color:var(--gd);box-shadow:0 0 12px #f2c14e44}
.tmh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.tmh b{font:900 .85rem Impact,sans-serif;letter-spacing:1.5px;color:var(--gd)}.tmh span{font-size:.7rem;color:var(--mut);font-weight:700}
.tm.done .tmh span{color:var(--g)}
.ts{display:flex;align-items:center;gap:10px;padding:6px;border-radius:9px;background:#07122f;border-left:4px solid var(--pc);cursor:pointer}
.ts .art{width:48px;height:48px;flex:none;border-width:1.5px}.ts .art span{font-size:1.4rem}
.ts .tn{flex:1;min-width:0}.ts .tn small{display:block;font:900 .62rem Impact,sans-serif;letter-spacing:1.5px;color:var(--pc)}
.ts .tn b{font-size:.88rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ts .tn b.src{color:var(--mut);font-style:italic;font-weight:600}
.ts .tier{font-size:.6rem;padding:1px 6px}
.ts.win{background:linear-gradient(90deg,#f2c14e30,#07122f 70%);box-shadow:inset 0 0 0 1px #f2c14e99}
.ts.lose{opacity:.45;filter:grayscale(.8)}.ts.lose .tn b{text-decoration:line-through}
.tlp{font:900 1rem "Arial Black",Impact,sans-serif;text-align:right}.tlp small{display:block;font:700 .55rem system-ui;color:var(--mut);letter-spacing:1px}
.tvs{text-align:center;font:900 .68rem Impact,sans-serif;letter-spacing:3px;color:var(--mut);margin:3px 0}
.tmf{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.74rem;color:var(--mut);min-height:20px}.tmf span{flex:1}
.tplay{padding:9px 14px;border-radius:9px;border:2px solid var(--gd);background:linear-gradient(#3a3f7a,#14183f);color:var(--gd);font:900 .85rem Impact,sans-serif;letter-spacing:1px;white-space:nowrap}
.tund{padding:6px 10px;border-radius:8px;border:1px solid #2c58b8;background:#0a1740;color:var(--mut);font-size:.72rem;font-weight:800;white-space:nowrap}
.tplay:active,.tund:active,.tstp button:active{transform:scale(.95)}
.ph0{--c:#2a3558}.ph0 span{color:#ffffff66;font-family:Impact,sans-serif}
.gt{width:100%;border-collapse:collapse;font-size:.82rem}.gt th{color:var(--mut);font-size:.66rem;padding:4px 3px;font-weight:800}
.gt td{padding:6px 3px;border-top:1px solid #2c58b8;text-align:center}.gt td.dn{text-align:left;font-weight:800;max-width:0;width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt tr.q td:first-child{color:var(--g);font-weight:900}.gt tr.out{opacity:.45}.gt em{font-style:normal;font-size:.62rem;color:var(--gd);display:block}
.ghd{display:flex;justify-content:space-between;align-items:center}.ghd .clh{margin:0 0 6px}
.champ{text-align:center;border:2px solid var(--gd);animation:glow 1.6s ease-in-out infinite alternate}
.champ .art{width:min(220px,80%);aspect-ratio:1/1;margin:8px auto}.champ .art span{font-size:4rem}
.champ h2{margin:6px 0 0;color:var(--gd);font:900 1.6rem Impact,sans-serif;letter-spacing:4px}.champ h3{margin:4px 0}.champ p{margin:4px 0;color:var(--mut);font-size:.85rem}
@keyframes glow{to{box-shadow:0 0 30px #f2c14ebb}}
.tmb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--gd);background:#f2c14e1a;color:var(--gd);font:900 .8rem Impact,sans-serif;letter-spacing:1.5px;cursor:pointer}
.tmb small{font:700 .7rem system-ui;color:var(--mut);letter-spacing:0;white-space:nowrap}
.htl{font-size:.75rem;color:var(--gd);font-weight:800;margin-top:2px}
.flash{animation:fl2 1.4s}@keyframes fl2{25%,60%{box-shadow:0 0 0 3px var(--cy),0 0 20px var(--cy)}}
.tfl{list-style:none;padding:0;margin:8px 0;text-align:left;font-size:.84rem;line-height:1.4}.tfl li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid #2c58b855}
.tfl li b{flex:none;width:86px;color:var(--gd);font:900 .8rem Impact,sans-serif;letter-spacing:1px}.tfl li span{color:var(--mut)}

async function outShare(){const o=OUT;if(!o)return;
 try{const f=new File(['﻿'+o.text],o.name,{type:o.mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:o.name});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{if(navigator.share&&o.text.length<60000){await navigator.share({title:o.name,text:o.text});return}}catch(e){if(e&&e.name==='AbortError')return}
 outCopy()}
async function outCopy(){const o=OUT;if(!o)return;
 try{await navigator.clipboard.writeText(o.text);toast('Copiado! Cole onde quiser.');return}catch(e){}
 try{const t=document.createElement('textarea');t.value=o.text;t.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,t.value.length);const ok=document.execCommand('copy');t.remove();if(ok){toast('Copiado! Cole onde quiser.');return}}catch(e){}
 toast('Não consegui copiar. Use Baixar arquivo.')}
function outDl(){const o=OUT;if(!o)return;
 try{const b=new Blob(['﻿'+o.text],{type:o.mime+';charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Arquivo gerado - veja em Downloads')}catch(e){toast('Não deu para baixar. Use Copiar.')}}

 if(Array.isArray(j.custom)){let k=0;j.custom.forEach(c=>{if(c&&c.n&&!BASENAMES.includes(c.n)&&!CUS.some(x=>x.n===c.n)){CUS.push(c);k++}});if(k){saveCus();rl=true;ex+='\n'+k+' deck(s) cadastrado(s) adicionado(s); o app vai recarregar.'}}

 if(j.camp&&Array.isArray(j.camp)){const ts=new Set(CAMP.map(c=>c.t));const nc=j.camp.filter(c=>c&&c.t&&!ts.has(c.t));if(nc.length){CAMP=CAMP.concat(nc).sort((a,b)=>b.t-a.t);saveCamp();ex+='\n'+nc.length+' campeão(ões) adicionado(s).'}}
 if(j.torneio&&j.torneio.M&&JSON.stringify(j.torneio)!==JSON.stringify(T)&&(!T||confirm('O arquivo tem um torneio salvo. Substituir o torneio atual por ele?'))){T=j.torneio;saveT();ex+='\nTorneio carregado.'}
 const ns=j.snd?Object.keys(j.snd).filter(k=>MOM[k]&&typeof j.snd[k]==='string').length:0;
 if((j.cfg||j.tiers||ns)&&confirm(`O backup também tem configurações e tiers${ns?` e ${ns} áudio(s) próprio(s)`:''}. Restaurar isso também?`)){
  if(j.cfg)Object.assign(CFG,j.cfg),saveCfg();

 rT();rS();alert((n?n+' duelo(s) adicionado(s).':'Nenhum duelo novo (já estavam aqui).')+ex);if(rl)location.reload()}catch(x){alert('Arquivo inválido.')}}

 :s?`<div class="tmb" style="cursor:default"><span>🎯 MELHOR DE 3 · DUELO ${Math.min(3,s.g[0]+s.g[1]+(over?0:1))}</span><small><b style="color:var(--g)">${s.g[0]}</b> × <b style="color:var(--b)">${s.g[1]}</b></small></div>`:''}

function playM(id){const m=T&&T.M[id];if(!m||m.w!=null)return;const a=side(m,0),b=side(m,1);if(a==null||b==null)return;
 if(duel.tm===id&&!over){goTab('duelo');return}
 if(duel.log.length&&!over&&!confirm('O contador tem um duelo em andamento. Começar '+mlab(m)+' mesmo assim?'))return;
 newDuel([a,b],id);goTab('duelo');play('sweep')}
function goT(id){if(!T)return;const m=T.M[id];TV=m?(T.fmt==='liga'?String(m.r):m.st):null;rT();goTab('torneio');
 setTimeout(()=>{const e=document.getElementById('tm-'+id);if(e){e.scrollIntoView({block:'center',behavior:'smooth'});e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1500)}},60)}
function undoM(id){const m=T&&T.M[id];if(!m||m.w==null||locked(id))return;
 if(!confirm(`Desfazer o resultado de ${mlab(m)}? Esse duelo também sai do Histórico e do placar.`))return;
 if(m.h!=null){hist=hist.filter(h=>h.t!==m.h);save();rH()}m.w=m.lp=m.h=null;saveT();tBan();rT();play('click')}
function sortT(){if(tBusy)return;if(T&&allM().some(m=>m.w!=null))return;
 if(T&&!confirm('Sortear o chaveamento de novo?'))return;
 if(BASEN!==24){alert('O torneio foi montado para 24 decks e a lista tem '+BASEN+'.');return}
 tBusy=true;TV='r1';play('sweep');const ix=[...Array(BASEN).keys()];let n=0;
 const iv=setInterval(()=>{T=mkT(shuffle(ix));rT('shuf');play('tickU');if(++n>14){clearInterval(iv);T=mkT(shuffle(ix));saveT();tBusy=false;rT('pop');play('win');scrollTo({top:0,behavior:'smooth'})}},100)}
function novoT(){const lg=T&&T.fmt==='liga',f=T&&(lg?null:T.M.f),fin=T&&(lg?allM().every(m=>m.w!=null):f&&f.w!=null);
 if(T&&!confirm(fin?'Guardar o campeão na galeria e começar outro torneio?':'O torneio ainda não terminou. Apagar a chave e começar outro? (Os duelos já jogados continuam no Histórico.)'))return;
 if(fin){const W=[0,1].map(p=>allM().filter(m=>m.w===p).length);if(lg){const st=ligaStand();CAMP.unshift({t:Date.now(),c:st[0].n,v:st[1].n,p:null,s:W,fmt:'liga',n:T.ds.length})}else CAMP.unshift({t:Date.now(),c:dn(side(f,f.w)),v:dn(side(f,1-f.w)),p:f.w,s:W});saveCamp()}
 archT();T=null;TV=null;saveT();if(duel.tm){duel.tm=null;tBan()}rT();rH();play('click')}

function mCard(m,an){const ii=[side(m,0),side(m,1)],done=m.w!=null,ready=!done&&ii[0]!=null&&ii[1]!=null;
 const row=s=>{const i=ii[s],r=s?m.b:m.a;
  return `<div class="ts ${done?(m.w===s?'win':'lose'):''}" style="--pc:${COR[s]}" ${i!=null?`onclick="info(${i})"`:''}>${i!=null?art(i):'<div class="art ph0"><span>?</span></div>'}<div class="tn"><small>${NOMES[s].toUpperCase()}${done&&m.w===s?' · VENCEU':''}</small>${i!=null?`<b>${esc(DECKS[i][0])}</b><span class="tier t${DECKS[i][1]}">TIER ${DECKS[i][1]}</span>`:`<b class="src">${srcTxt(r)}</b>`}</div>${done&&m.lp?`<div class="tlp"><small>LP</small>${m.lp[s]}</div>`:''}</div>`};
 const ft=`${ready&&!tBusy?`<button class="tplay" onclick="playM('${m.id}')">⚔️ Jogar</button>`:''}${done&&!locked(m.id)?`<button class="tund" onclick="undoM('${m.id}')">↩ Desfazer</button>`:''}`;
 return `<div class="card tm ${done?'done':ready?'ready':''} ${an||''}" id="tm-${m.id}"><div class="tmh"><b>${mlab(m).toUpperCase()}</b><span>${done?'✓ Concluído':ready?'Pronto para jogar':'Aguardando'}</span></div>${row(0)}<div class="tvs">VS</div>${row(1)}
 ${(m.st!=='g'&&m.st!=='lg')||ft?`<div class="tmf"><span>${m.st!=='g'&&m.st!=='lg'?(m.st==='f'?'🏆 ':'Vencedor ➜ ')+destTxt(m):''}</span>${ft}</div>`:''}</div>`}
function gTable(g){const s=stand(g),ids=GRP[g].map(id=>res({win:id}));
 const rows=s?s.rows:ids.map((i,k)=>({i,v:0,d:0,lp:0,src:srcTxt({grp:g,k})}));
 return `<div class="card"><div class="clh">GRUPO ${g}</div><table class="gt"><tr><th>#</th><th style="text-align:left">Deck</th><th>V</th><th>D</th><th>Saldo LP</th></tr>`+
  rows.map((r,k)=>`<tr class="${s&&s.done?(k<2?'q':'out'):''}"><td>${s?k+1+'º':'–'}</td><td class="dn">${r.i!=null?esc(dn(r.i)):`<span style="color:var(--mut);font-weight:600;font-style:italic">${r.src}</span>`}${s&&s.done?`<em>${k<2?'➜ Semifinal':'Eliminado'}${r.sor?' · 🎲 decidido no sorteio':''}</em>`:''}</td><td>${r.v}</td><td>${r.d}</td><td>${r.lp}</td></tr>`).join('')+
  `</table><div class="cnote">Passam os 2 com mais vitórias. Se os três vencerem uma vez, fica na frente quem somou mais LP restante nas vitórias.</div></div>`}
function rT(an){const el=$('#tour');if(!el)return;
 if(!T){el.innerHTML=`<div class="card thd"><h2 style="margin:4px 0;color:var(--gd);font:900 1.05rem Impact,sans-serif;letter-spacing:1.5px">🏟️ MATA-MATA DOS 24 DECKS</h2>
  <details class="tinfo"><summary>ℹ️ Como funciona</summary><ul class="tfl"><li><b>1ª RODADA</b><span>12 duelos sorteados, quem perde sai</span></li><li><b>2ª RODADA</b><span>6 duelos entre os vencedores</span></li><li><b>GRUPOS</b><span>2 grupos de 3, todos contra todos; passam 2 de cada</span></li><li><b>SEMIFINAL</b><span>1º do A × 2º do B · 2º do A × 1º do B</span></li><li><b>FINAL</b><span>1 duelo valendo o título</span></li></ul>
  <div class="trule"><p><b>Quem usa cada deck:</b> na 1ª rodada o sorteio define. Na 2ª, Douglas usa o vencedor do confronto ímpar e João o do par (C1 × C2, C3 × C4…). Nos grupos, cada um usa cada deck uma vez. Na semi, cada um fica com um 1º colocado. Na final, Douglas usa o vencedor da Semi 1 e João o da Semi 2.</p></div></details>
  <button class="btn" onclick="sortT()">🎲 Sortear chaveamento</button></div>${ligaIntro()}${campHTML()}`;return}
 if(T.fmt==='liga')return rLiga(an);
 const M=allM(),done=M.filter(m=>m.w!=null).length,W=[0,1].map(p=>M.filter(m=>m.w===p).length),nx=nextM(),f=T.M.f;
 if(!TV)TV=curSt();
 let h=`<div class="card thd"><div class="tsc"><span style="color:var(--g)">Douglas ${W[0]}</span> × <span style="color:var(--b)">${W[1]} João</span></div><div class="tbar"><i style="width:${done/M.length*100}%"></i></div><small>${done} de ${M.length} duelos · ${STN[curSt()]}</small>
  ${tBusy?'':nx?`<button class="btn" onclick="playM('${nx.id}')">⚔️ Próximo: ${mlab(nx)}</button>`:f.w!=null?`<p style="margin:10px 0 0;color:var(--gd);font-weight:800">🏆 ${esc(dn(side(f,f.w)))} é o campeão!</p>`:''}</div>`;
 h+=`<div class="tstp">`+Object.keys(STN).map(s=>{const ms=M.filter(m=>m.st===s),d=ms.filter(m=>m.w!=null).length;return `<button class="${TV===s?'on':''} ${d===ms.length?'ok':''}" onclick="TV='${s}';rT();play('click')">${STC[s]}<small>${d===ms.length?'✓':d+'/'+ms.length}</small></button>`}).join('')+`</div>`;
 const ms=M.filter(m=>m.st===TV);
 if(TV==='g')h+=['A','B'].map(g=>gTable(g)+ms.filter(m=>m.id[1]===g).map(m=>mCard(m,an)).join('')).join('');
 else{if(TV==='f'&&f.w!=null){const ci=side(f,f.w);h+=`<div class="card champ">${art(ci)}<h2>CAMPEÃO</h2><h3>${esc(dn(ci))}</h3><p>Usado por ${NOMES[f.w]} na final contra ${esc(dn(side(f,1-f.w)))}</p></div>`}
  h+=ms.map(m=>mCard(m,an)).join('')}
 h+=`<div class="row" style="margin-top:4px">${done?'':`<button class="btn" style="padding:12px;font-size:.85rem" onclick="sortT()">🔀 Sortear de novo</button>`}<button class="btn" style="padding:12px;font-size:.85rem;border-color:#2c58b8;color:var(--mut)" onclick="novoT()">${f.w!=null?'🏁 Novo torneio':'🗑 Encerrar torneio'}</button></div>`+campHTML();
 el.innerHTML=h}
// ===== Liga de pontos corridos =====
// Todos contra todos uma vez (tabela de rodízio). Lado 0 = Douglas; os lados alternam para cada deck ser usado pelos dois.
let LN=6,LPK=[];
function mkLiga(ix,pk){const n=ix.length,M={},a=[...ix];
 for(let r=0;r<n-1;r++){for(let k=0;k<n/2;k++){let x=a[k],y=a[n-1-k];if(k===0?r%2:(r+k)%2)[x,y]=[y,x];
   const id='l'+(r+1)+'-'+(k+1);M[id]={id,st:'lg',r:r+1,n:k+1,a:{d:DECKS[x][0]},b:{d:DECKS[y][0]},w:null,lp:null,h:null}}
  a.splice(1,0,a.pop())}
 // Equilibra os lados: troca quem usa cada deck até que cada deck fique o mais dividido possível entre Douglas e João
 const ms=Object.values(M),bal=()=>{const c={};ms.forEach(m=>{c[m.a.d]=(c[m.a.d]||0)+1;c[m.b.d]=(c[m.b.d]||0)-1});return c};
 for(let it=0,ch=true;ch&&it<200;it++){ch=false;const c=bal();for(const m of ms){if(c[m.a.d]-c[m.b.d]>=3){[m.a,m.b]=[m.b,m.a];ch=true;break}}}
 const tb={};ix.forEach(i=>tb[DECKS[i][0]]=Math.random());return{fmt:'liga',v:1,t:Date.now(),M,tb,ds:ix.map(i=>DECKS[i][0]),pk:!!pk}}
function ligaStand(){const rows=T.ds.map(n=>({n,i:DI(n)<0?null:DI(n),j:0,v:0,d:0,lp:0})),R=n=>rows.find(r=>r.n===n);
 allM().forEach(m=>{if(m.w==null)return;const W=R(m.w?m.b.d:m.a.d),L=R(m.w?m.a.d:m.b.d);if(!W||!L)return;W.j++;L.j++;W.v++;L.d++;W.lp+=m.lp?m.lp[m.w]:0});
 rows.sort((x,y)=>y.v-x.v||y.lp-x.lp||(T.tb[y.n]||0)-(T.tb[x.n]||0));return rows}
function ligaIntro(){return `<div class="card thd" style="margin-top:12px"><h2 style="margin:4px 0;color:var(--gd);font:900 1.15rem Impact,sans-serif;letter-spacing:2px">📋 LIGA DE PONTOS CORRIDOS</h2>
 <details class="tinfo"><summary>ℹ️ Como funciona</summary><div class="trule"><p>Todos contra todos, uma vez. Quem somar mais vitórias é o campeão; empate decide pelo saldo de LP restante nas vitórias. Cada deck é usado mais ou menos metade das vezes por cada um de vocês.</p></div></details>
 <div class="opt"><b>Quantos decks?</b><div class="seg">${[[4,6],[6,15],[8,28]].map(([n,j])=>`<button class="${LN===n?'on':''}" onclick="LN=${n};rT();play('click')">${n} decks<br><small>${j} duelos</small></button>`).join('')}</div></div>
 <div class="row"><button class="btn" style="padding:13px;font-size:.85rem" onclick="ligaRand()">🎲 Sortear decks</button><button class="btn" style="padding:13px;font-size:.85rem" onclick="ligaPick()">✋ Escolher</button></div></div>`}
function ligaAnim(ix,pk){tBusy=true;play('sweep');let n=0;const all=[...DECKS.keys()];
 const iv=setInterval(()=>{T=mkLiga(pk?shuffle(ix):shuffle(all).slice(0,ix.length),pk);TV='1';rT('shuf');play('tickU');if(++n>12){clearInterval(iv);T=mkLiga(pk?shuffle(ix):shuffle(all).slice(0,ix.length),pk);TV='1';saveT();tBusy=false;rT('pop');play('win');scrollTo({top:0,behavior:'smooth'})}},100)}
function ligaRand(){if(!tBusy)ligaAnim([...Array(LN).keys()],false)}
function ligaPick(){LPK=[];rPick()}
function rPick(){const y=$('#box').scrollTop;modal(`<h2>ESCOLHER ${LN} DECKS</h2><p class="cnote" style="text-align:center">${LPK.length} de ${LN} escolhidos</p>`+
 [...DECKS.keys()].sort((a,b)=>DECKS[a][1]-DECKS[b][1]).map(i=>`<div class="rk ${LPK.includes(i)?'sel':''}" onclick="pk(${i})">${art(i)}<div class="mid"><b>${esc(DECKS[i][0])}</b><span class="tier t${DECKS[i][1]}">T${DECKS[i][1]}</span></div><div class="vd">${LPK.includes(i)?'✓':''}</div></div>`).join('')+
 `<button class="btn" ${LPK.length===LN?'':'disabled style="opacity:.4"'} onclick="if(LPK.length===LN){fechar();ligaAnim(LPK,true)}">Montar a liga</button><button ${BTN2} onclick="fechar()">Cancelar</button>`);$('#box').scrollTop=y}
function pk(i){const k=LPK.indexOf(i);if(k>=0)LPK.splice(k,1);else if(LPK.length<LN)LPK.push(i);else{toast('Já escolheram '+LN+' decks');return}play('click');rPick()}
function ligaRedo(){if(tBusy||allM().some(m=>m.w!=null))return;if(!confirm(T.pk?'Sortear a ordem dos jogos de novo?':'Sortear outros decks para a liga?'))return;
 const ix=T.ds.map(DI).filter(i=>i>=0);LN=ix.length;ligaAnim(ix,T.pk)}
function rLiga(an){const el=$('#tour'),M=allM(),done=M.filter(m=>m.w!=null).length,W=[0,1].map(p=>M.filter(m=>m.w===p).length),nx=nextM(),fin=done===M.length,st=ligaStand(),R=Math.max(...M.map(m=>m.r));
 if(!TV||!(+TV>=1&&+TV<=R))TV=curSt();
 let h=`<div class="card thd"><div class="cnote" style="margin:0 0 4px;letter-spacing:2px;font-weight:800">📋 LIGA DE ${T.ds.length} DECKS</div><div class="tsc"><span style="color:var(--g)">Douglas ${W[0]}</span> × <span style="color:var(--b)">${W[1]} João</span></div><div class="tbar"><i style="width:${done/M.length*100}%"></i></div><small>${done} de ${M.length} duelos · Rodada ${curSt()} de ${R}</small>
  ${tBusy?'':nx?`<button class="btn" onclick="playM('${nx.id}')">⚔️ Próximo: ${mlab(nx)}</button>`:''}</div>`;
 if(fin&&!tBusy)h+=`<div class="card champ">${art(st[0].i)}<h2>CAMPEÃO</h2><h3>${esc(st[0].n)}</h3><p>${st[0].v} vitórias em ${st[0].j} jogos · vice: ${esc(st[1].n)}</p>${st[1].v===st[0].v&&st[1].lp===st[0].lp?'<p>🎲 Empate em vitórias e saldo de LP, decidido no sorteio</p>':''}</div>`;
 h+=`<div class="card"><div class="clh" style="margin-top:0">CLASSIFICAÇÃO</div><table class="gt lgt"><tr><th>#</th><th style="text-align:left">Deck</th><th>J</th><th>V</th><th>D</th><th>Saldo LP</th></tr>`+
  st.map((r,k)=>`<tr class="${fin?(k===0?'q':''):''}"><td>${k+1}º</td><td class="dn" onclick="${r.i!=null?`info(${r.i})`:''}" style="cursor:pointer"><div class="lgn">${art(r.i)}<span>${esc(r.n)}</span></div></td><td>${r.j}</td><td>${r.v}</td><td>${r.d}</td><td>${r.lp}</td></tr>`).join('')+
  `</table><div class="cnote">Ordem: vitórias, depois saldo de LP restante nas vitórias.</div></div>`;
 h+=`<div class="tstp" style="flex-wrap:wrap">`+[...Array(R).keys()].map(k=>{const r=k+1,ms=M.filter(m=>m.r===r),d=ms.filter(m=>m.w!=null).length;return `<button style="min-width:40px" class="${TV===String(r)?'on':''} ${d===ms.length?'ok':''}" onclick="TV='${r}';rT();play('click')">R${r}<small>${d===ms.length?'✓':d+'/'+ms.length}</small></button>`}).join('')+`</div>`;
 h+=M.filter(m=>String(m.r)===TV).map(m=>mCard(m,an)).join('');
 h+=`<div class="row" style="margin-top:4px">${done?'':`<button class="btn" style="padding:12px;font-size:.85rem" onclick="ligaRedo()">🔀 Sortear de novo</button>`}<button class="btn" style="padding:12px;font-size:.85rem;border-color:#2c58b8;color:var(--mut)" onclick="novoT()">${fin?'🏁 Nova competição':'🗑 Encerrar liga'}</button></div>`+campHTML();
 el.innerHTML=h}
function campHTML(){if(!CAMP.length)return'';return `<div class="card" style="margin-top:12px"><div class="clh" style="margin-top:0">🏅 GALERIA DE CAMPEÕES</div>`+CAMP.map(c=>{const i=DI(c.c);return `<div class="cmp">${art(i<0?null:i)}<div><b>${esc(c.c)}</b><small>${new Date(c.t).toLocaleDateString('pt-BR')} · ${c.fmt==='liga'?`📋 Liga de ${c.n||'?'} decks · vice: ${esc(c.v)}`:`🏟️ Mata-mata · final com ${NOMES[c.p]} contra ${esc(c.v)}`} · placar ${c.s[0]} × ${c.s[1]}</small></div></div>`}).join('')+`</div>`}

// ===== Animações: tela de VS e vitória =====
function fxOpen(html,ms,hook){return new Promise(ok=>{const f=$('#fx');f.className='on';f.innerHTML=html;let done=false;const t0=Date.now();
 const end=()=>{if(done)return;done=true;clearTimeout(tm);f.classList.add('out');setTimeout(()=>{f.className='';f.innerHTML='';ok()},330)};
 const tm=setTimeout(end,ms);f.onclick=()=>{if(Date.now()-t0>400)end()};if(hook)hook(end)})}
const deckArt=di=>di!=null&&DECKS[di]?art(di):'<div class="art" style="--c:#556"><span>👤</span></div>';
function showVS(){const d=duel.decks;play('clash');const snd=!mute&&(CSND.start||DEF.start);
 return fxOpen(`<div class="vsp">${[0,1].map(p=>`<div class="hf h${p}" style="--pc:${COR[p]}">${deckArt(d[p])}<div class="nm"><b>${NOMES[p].toUpperCase()}</b><small>${esc(dn(d[p]))}</small></div></div>`).join('')}<div class="vsx">VS</div><div class="cap">É HORA DO DUELO!</div></div>`,snd?14000:2700,end=>{const t0=Date.now(),fin=()=>setTimeout(end,Math.max(0,2700-(Date.now()-t0)));
  setTimeout(()=>{const a=moment('start','É hora do duelo!');if(a){a.onended=end;a.onerror=()=>{say('É hora do duelo!');fin()}}else fin()},380);

function duelStart(){if(duel.decks&&(duel.log.length||over))$('#players').classList.remove('lphide');if(!duel.decks||duel.ann||duel.log.length||over)return;duel.ann=1;const ask0=()=>{if(duel.first==null&&!over&&$('#duelo').classList.contains('on'))quemComeca()},ask=()=>revealLP().then(ask0);
 if(CFG.vs)showVS().then(ask);else{play('clash');const a=moment('start','É hora do duelo!');if(a){a.onended=ask;a.onerror=ask}else ask()}}
// A carta sobe girando, vira mostrando a arte do deck vencedor e explode em luz. Na final do torneio: dourado, coroa e confete.

 const cf=fin?[...Array(46)].map(()=>`<i class="cf" style="left:${(Math.random()*100).toFixed(1)}%;--dx:${Math.round(Math.random()*120-60)}px;--rt:${Math.round(Math.random()*900)}deg;--du:${(2.4+Math.random()*2).toFixed(2)}s;--dl:${(1.1+Math.random()*2.5).toFixed(2)}s;--sc:${pick(['#f2c14e','#3dff7a','#4aa3ff','#ff5a6e','#fff','#35e0ff'])}"></i>`).join(''):'';
 play('rise');setTimeout(()=>play('boom'),950);setTimeout(()=>{play('win');fin?moment('champ',`${dn(di)} é o campeão do torneio!`):moment('win',`${NOMES[w]} vence o duelo!`)},1300);
 return fxOpen(`<div class="vic shk" style="--vc:${vc};background:radial-gradient(circle at 50% 42%,${vc}55,#000000f0 62%)"><div class="rays"></div><i class="ring"></i><i class="ring r2"></i>${sp}
  <div class="stage"><div class="vc"><div class="vb"></div><div class="vf"><div class="nb">${esc(d?d[0]:NOMES[w])}</div>${deckArt(di)}<div class="ft">${fin?'★ CAMPEÃO ★':'VITÓRIA'}</div></div></div></div>
  ${fin?'<div class="crn">👑</div>':''}<div class="ttl"><b>${fin?'CAMPEÃO!':NOMES[w].toUpperCase()+' VENCE!'}</b><small>${fin?esc(dn(di))+(w!=null?' · '+NOMES[w]:''):d?esc(d[0]):''}</small></div>${cf}<div class="tip">toque para continuar</div></div>`,fin?7500:4300)}

  const mv=by((a,b)=>b.v-a.v||a.d-b.d),bp=by((a,b)=>b.v/b.g-a.v/a.g||b.g-a.g,3),ml=by((a,b)=>b.d-a.d||a.v-b.v),fs=L.filter(s=>s.wc).sort((a,b)=>a.wd/a.wc-b.wd/b.wc)[0],mu=by((a,b)=>b.g-a.g),bd2=by((a,b)=>b.dmg/b.g-a.dmg/a.g,2);

   (CF.length?CF.map(x=>`<div class="rk" onclick="info(${x.i})">${art(x.i)}<div class="mid"><b>${esc(x.n)}</b><span class="tier t${x.cur}">T${x.cur}</span> <small style="display:inline">${x.g} jogo${x.g>1?'s':''} · ${x.w}V ${x.g-x.w}D</small><div class="cf3">${[['↓ fraco',0],['= igual',1],['↑ forte',2]].map(([l,k])=>`<span>${l} <b>${x.b[k][0]}-${x.b[k][1]}</b></span>`).join('')}</div></div><div class="cfr"><b class="${x.sc>0?'pos':x.sc<0?'neg':''}">${x.sc>0?'+':''}${Math.round(x.sc*100)}</b><small>pts vs esperado</small>${x.g<CFN?`<span class="sug">poucos jogos (${x.g}/${CFN})</span>`:x.sug===x.cur?'<span class="sug">✓ tier certo</span>':`<button class="sug ${x.sug<x.cur?'up':'dn'}" onclick="event.stopPropagation();applyTier(${x.i},${x.sug})">${x.sug<x.cur?'↑':'↓'} Tier ${x.sug}</button>`}</div></div>`).join(''):'<div class="mini" style="text-align:left">Ainda sem duelos com decks sorteados.</div>')+`<div class="cnote">Legenda: ↓ fraco = deck de tier pior que o seu · ↑ forte = deck de tier melhor. Tier 1 é o mais forte.</div></div>`;

   EL.map((x,k)=>`<div class="rk" onclick="info(${x.i})"><span class="no">${k+1}</span>${art(x.i)}<div class="mid"><b>${esc(x.n)}</b><span class="tier t${x.cur}">T${x.cur}</span> <small style="display:inline">${x.g} jogo${x.g>1?'s':''}</small></div><span class="elo">${Math.round(x.e)}</span>${x.g<4?'<span class="sug">poucos jogos</span>':x.sug===x.cur?'<span class="sug">✓ tier certo</span>':`<button class="sug ${x.sug<x.cur?'up':'dn'}" onclick="event.stopPropagation();applyTier(${x.i},${x.sug})">${x.sug<x.cur?'↑':'↓'} Tier ${x.sug}</button>`}</div>`).join('')+`</div>`;
  // --- Tiers e zebras
  const tg={},zb=[];R.forEach(({h})=>{if(!h.decks)return;const tt=h.decks.map(tierOf);if(tt.some(x=>x==null))return;
   [0,1].forEach(p=>{const q=tg[tt[p]]||(tg[tt[p]]=[0,0]);q[0]+=h.w===p?1:0;q[1]++});const d=tt[h.w]-tt[1-h.w];if(d>0)zb.push({h,d,tt})});
  o+=`<div class="sh">🎯 TIERS</div><div class="card">`+[1,2,3,4,5].map(k=>{const q=tg[k];return `<div class="hb"><span class="tier t${k}" style="text-align:center">TIER ${k}</span><div class="pb"><i style="width:${q?q[0]/q[1]*100:0}%"></i></div><span>${q?`<b>${pct(q[0],q[1])}</b> · ${q[1]} jogo${q[1]>1?'s':''}`:'sem jogos'}</span></div>`}).join('')+
   `<div class="cnote">Aproveitamento dos decks de cada tier. Tier 1 é o mais forte.</div>

   (zb.length?zb.sort((a,b)=>b.d-a.d||b.h.t-a.h.t).slice(0,5).map(({h,tt})=>`<div class="rec"><i>🦓</i><div><b>${esc(h.decks[h.w])} <span class="tier t${tt[h.w]}">T${tt[h.w]}</span></b><small>venceu ${esc(h.decks[1-h.w])} (T${tt[1-h.w]}) · ${NOMES[h.w]} · ${dt(h.t)}</small></div></div>`).join(''):'<div class="mini" style="text-align:left">Nenhuma zebra ainda.</div>')+`</div>`;

// Gráfico: saldo de vitórias (Douglas − João) duelo a duelo
const RW=340,RH=150,RPL=26,RPR=8,RPT=12,RPB=12;
function raceSVG(R){let s=0;const pts=[0].concat(R.map(x=>s+=x.h.w===0?1:-1)),n=R.length,m=Math.max(1,...pts.map(Math.abs));
 const X=i=>RPL+i*(RW-RPL-RPR)/n,Y=v=>RPT+(m-v)*(RH-RPT-RPB)/(2*m),z=Y(0),d=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(''),ar=d+`L${X(n)} ${z}L${X(0)} ${z}Z`;
 return `<div class="chw"><svg viewBox="0 0 ${RW} ${RH}" id="race" role="img" aria-label="Saldo de vitórias ao longo dos duelos"><defs><clipPath id="rcu"><rect width="${RW}" height="${z}"/></clipPath><clipPath id="rcd"><rect y="${z}" width="${RW}" height="${RH}"/></clipPath></defs>
  <line x1="${RPL}" x2="${RW-RPR}" y1="${z}" y2="${z}" stroke="#8fb0d8" stroke-opacity=".55" stroke-dasharray="3 3"/>
  <g font-size="9" fill="#8fb0d8" text-anchor="end"><text x="${RPL-5}" y="${Y(m)+3}">+${m}</text><text x="${RPL-5}" y="${z+3}">0</text><text x="${RPL-5}" y="${Y(-m)+3}">+${m}</text></g>
  <path d="${ar}" fill="#3dff7a" fill-opacity=".2" clip-path="url(#rcu)"/><path d="${ar}" fill="#4aa3ff" fill-opacity=".2" clip-path="url(#rcd)"/>
  <path d="${d}" fill="none" stroke="#e6f4ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <g font-size="9" font-weight="700"><text x="${RPL+5}" y="${RPT+2}" fill="#e6f4ff"><tspan fill="#3dff7a">▲</tspan> Douglas na frente</text><text x="${RPL+5}" y="${RH-3}" fill="#e6f4ff"><tspan fill="#4aa3ff">▼</tspan> João na frente</text></g>
  <line id="rcx" y1="${RPT-4}" y2="${RH-RPB+4}" stroke="#35e0ff" stroke-width="1" opacity="0"/><circle id="rcd2" r="4.5" fill="#35e0ff" stroke="#07122f" stroke-width="2" opacity="0"/>
  <rect id="rhit" x="${RPL-6}" y="0" width="${RW-RPL-RPR+12}" height="${RH}" fill="transparent"/></svg><div class="ctt" id="rtt"></div></div>`}
function raceHover(sv,R){let s=0;const pts=[0].concat(R.map(x=>s+=x.h.w===0?1:-1)),n=R.length,m=Math.max(1,...pts.map(Math.abs)),X=i=>RPL+i*(RW-RPL-RPR)/n,Y=v=>RPT+(m-v)*(RH-RPT-RPB)/(2*m);
 const tt=$('#rtt'),cx=$('#rcx'),dt2=$('#rcd2');
 const show=ev=>{const b=sv.getBoundingClientRect(),xs=(ev.clientX-b.left)*RW/b.width,i=Math.max(0,Math.min(n,Math.round((xs-RPL)/((RW-RPL-RPR)/n)))),v=pts[i];
  cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.setAttribute('opacity',1);dt2.setAttribute('cx',X(i));dt2.setAttribute('cy',Y(v));dt2.setAttribute('opacity',1);
  const h=i?R[i-1].h:null;tt.innerHTML=i?`<b>Duelo ${i}</b> · ${dt(h.t)}<br>Venceu: ${NOMES[h.w]}${h.decks?' ('+esc(h.decks[h.w])+')':''}<br>${v>0?'Douglas +'+v:v<0?'João +'+(-v):'Empate'}`:'<b>Início</b>';
  tt.style.display='block';const px=X(i)*b.width/RW;tt.style.left=Math.max(70,Math.min(b.width-70,px))+'px';tt.style.top=(Y(v)*b.height/RH>b.height/2?4:b.height-tt.offsetHeight-4)+'px'};
 const hide=()=>{tt.style.display='none';cx.setAttribute('opacity',0);dt2.setAttribute('opacity',0)};
 const hit=$('#rhit');hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);hit.addEventListener('pointerleave',hide)}
function dStat(nm){const s=SD[nm];if(!s)return;const i=DI(nm),d=DECKS[i],tit=CAMP.filter(c=>c.c===nm).length;
 const op=Object.entries(s.op).sort((a,b)=>b[1][0]+b[1][1]-a[1][0]-a[1][1]);
 modal(`<h2>${esc(nm)}</h2>${d?`<span class="tier t${d[1]}">TIER ${d[1]}</span>`:''}${art(i<0?null:i)}
  <div class="tiles" style="text-align:left"><div class="tile"><small>Aproveitamento</small><b>${pct(s.v,s.g)}</b><span>${s.v} vitória${s.v===1?'':'s'} · ${s.d} derrota${s.d===1?'':'s'}</span></div>
  <div class="tile"><small>Títulos de torneio</small><b>${tit}</b><span>${tit?'🏆'.repeat(Math.min(tit,5)):'nenhum ainda'}</span></div>
  <div class="tile"><small>Tempo médio p/ vencer</small><b>${s.wc?fmt(s.wd/s.wc):'–'}</b></div><div class="tile"><small>LP médio ao vencer</small><b>${s.v?nf(s.lpw/s.v):'–'}</b></div>
  ${(x=>x?`<div class="tile"><small>Força real (Elo)</small><b>${Math.round(x.e)}</b><span>${x.g<4?'poucos jogos para sugerir':x.sug===x.cur?'tier atual confere':'sugere Tier '+x.sug}</span></div>`:'')(elo().find(x=>x.n===nm))}<div class="tile"><small>Dano por duelo</small><b>${nf(s.dmg/s.g)}</b></div><div class="tile"><small>Maior golpe</small><b>${s.big?nf(s.big):'–'}</b></div></div>
  <div class="clh">COM CADA JOGADOR</div>${[0,1].map(p=>`<div class="hb"><span style="color:${COR[p]};font-weight:800">${NOMES[p]}</span><div class="pb"><i style="width:${s.bp[p][0]+s.bp[p][1]?s.bp[p][0]/(s.bp[p][0]+s.bp[p][1])*100:0}%"></i></div><span><b>${s.bp[p][0]}V · ${s.bp[p][1]}D</b></span></div>`).join('')}
  <div class="clh">CONFRONTOS</div>${op.map(([o,q])=>`<div class="rk" style="cursor:default"><div class="mid"><b>${esc(o)}</b></div><div class="vd" style="color:${q[0]>q[1]?'var(--g)':q[0]<q[1]?'#ff8a8a':'var(--mut)'}">${q[0]}V · ${q[1]}D</div></div>`).join('')}
  ${i>=0?`<button class="btn" onclick="info(${i})">📚 Ver estratégia e cartas</button>`:''}<button class="btn" style="border-color:#2c58b8;color:var(--mut)" onclick="fechar()">Fechar</button>`);$('#box').scrollTop=0}

// Desempenho (guardado só neste aparelho, não vai no backup): fundo animado e modo leve
const PERF={bg:1,lite:0};try{Object.assign(PERF,JSON.parse(localStorage.getItem('ygo_perf')||'{}'))}catch(e){}
const savePerf=()=>{try{localStorage.setItem('ygo_perf',JSON.stringify(PERF))}catch(e){}};
let BGT=null,BGL=false;
function applyPerf(){document.body.classList.toggle('lite',!!PERF.lite);const w=$('#bgart');
 if(PERF.bg){if(!w.querySelector('.bc')){w.innerHTML='<div class="gr"></div>';mkBg()}if(!BGT)BGT=setInterval(flipTick,1300);if(!BGL&&window.ART_READY){BGL=true;loadBg()}}
 else{clearInterval(BGT);BGT=null;w.innerHTML=''}}
applyPerf();
// Celular fraco: se o app rodar a menos de 20 quadros/s (medido uma única vez, alguns segundos depois de abrir), pergunta se quer desligar o fundo animado.
setTimeout(()=>{if(!PERF.bg||PERF.probe)return;let n=0,t0=0;const f=t=>{if(!t0)t0=t;n++;if(t-t0<2000)requestAnimationFrame(f);else{PERF.probe=1;const fps=n/((t-t0)/1000);if(fps<20&&document.visibilityState==='visible'&&confirm('O app parece estar pesado neste celular. Desligar o fundo animado (as cartas virando) para ele ficar mais leve?\n\nDá para religar depois em ☰ → Sons e animações.')){PERF.bg=0;applyPerf()}savePerf()}};requestAnimationFrame(f)},9000);
Object.keys(MOM).forEach(k=>KV.get('snd:'+k).then(u=>{if(u)CSND[k]=u}));
rFiltro();rLista();rSort();rH();rT();newDuel();draw();wake(true);loadArt().then(()=>{window.ART_READY=1;if(PERF.bg&&!BGL){BGL=true;loadBg()}});
</script>
