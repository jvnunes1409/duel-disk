# Varredura de segurança do código (GitHub CodeQL): procura falhas como injeção de código e XSS
# a cada mudança e toda semana. Os alertas aparecem em Security → Code scanning.
name: Segurança (CodeQL)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
