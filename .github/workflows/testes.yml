# Roda todos os testes (app no navegador + Worker do Oráculo) a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor permissão possível: a automação só lê o código (não pode alterar nada no repositório)
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      # A máquina do GitHub já vem com o Google Chrome: usá-lo evita baixar navegador e pacotes do
      # Ubuntu a cada execução (quando os servidores do Ubuntu ficam fora, os testes não travam).
      - name: Escolher o navegador
        run: |
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; google-chrome --version
          else npx playwright install --with-deps chromium; fi
      - name: Rodar os testes
        run: npm test
